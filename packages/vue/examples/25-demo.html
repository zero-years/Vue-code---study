<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #app {
        padding: 100px;
      }

      .v-enter-active,
      .v-leave-active {
        transition: all 0.5s ease;
      }

      .v-enter-from,
      .v-leave-to {
        transform: translateX(50px);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script type="module">
      import { h, ref, createApp, createVNode } from '../dist/vue.esm.js'

      const App = {
        setup() {
          const count = ref(0)
          const style = ref({
            color: 'red',
          })
          setTimeout(() => {
            count.value++
            style.value.color = 'blue'
          }, 1000)
          return () => {
            const vnode = createVNode(
              'div',
              { class: 'container', style: style.value },
              count.value,
              5,
            )

            return vnode
          }
        },
      }

      const app = createApp(App)
      app.mount('#app')
    </script>
  </body>
</html>
