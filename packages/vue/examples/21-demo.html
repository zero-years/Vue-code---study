<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #app {
        padding: 100px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script type="module">
      import {
        h,
        ref,
        createApp,
        getCurrentInstance,
        provide,
        inject,
        // Teleport, // 用于将组件放置到另一个位置
        KeepAlive, // 用于将组件始终保持活性
        onMounted,
        onUnmounted,
      } from '../dist/vue.esm.js'

      const Com1 = {
        name: 'com1',
        setup() {
          onMounted(() => {
            console.log('挂载 com1')
          })
          onUnmounted(() => {
            console.log('卸载 com1')
          })
          return () => {
            return h('div', ['我是comp1', h('input')])
          }
        },
      }

      const Com2 = {
        name: 'com2',
        setup() {
          onMounted(() => {
            console.log('挂载 com2')
          })
          onUnmounted(() => {
            console.log('卸载 com2')
          })
          return () => {
            return h('div', ['我是comp2', h('input')])
          }
        },
      }

      const Com3 = {
        name: 'com3',
        setup() {
          onMounted(() => {
            console.log('挂载 com3')
          })
          onUnmounted(() => {
            console.log('卸载 com3')
          })
          return () => {
            return h('div', ['我是comp3', h('input')])
          }
        },
      }

      const App = {
        name: 'app',
        setup() {
          const components = [Com1, Com2, Com3]
          const index = ref(0)
          function onClick() {
            if (index.value < 2) {
              index.value++
            } else {
              index.value = 0
            }
          }

          return () => {
            return h('div', [
              h('button', { onClick }, '切换组件'),
              h(KeepAlive, { max: 3 }, () => h(components[index.value])),
              // h('div', null, h(components[index.value])),
            ])
          }
        },
      }

      const app = createApp(App)
      app.mount('#app')
    </script>
  </body>
</html>
